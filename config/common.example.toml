# doorpost が読む共通部分だけを書いた雛形。
#
# 使う側のサービスは、この 2 つ（listen と apps）に自分の項目を足した 1 つのファイルを
# 持つ。ここにある項目の意味はサービスが変わっても変わらない。
#
# 実ファイルは鍵を持つので追跡しない。雛形だけをリポジトリへ置く。
# 知らないキーがあると起動しない。綴りを間違えたときに、黙って既定値で動き出さないため。
# 書き換えたら再起動が要る。設定は起動時に 1 回だけ読む。

# 待ち受けアドレス。前段に逆プロキシを置くなら 127.0.0.1 に閉じる。
# 0.0.0.0 にすると、ホストのネットワークに面した口が 1 つ増える。
listen = "127.0.0.1:8080"

# 呼び出し元アプリ。1 アプリにつき [[apps]] を 1 つ書く。
# どのアプリとして扱うかは、リクエスト本文ではなくここの name から決まる。
# 本文に書かせると、どのアプリでも他のアプリを騙れてしまう。

[[apps]]
# このアプリの名前。他のアプリと重複させない。
name = "alpha"

# 有効な鍵。2 本まで書ける。
# 鍵は必ずいつか替える（漏れたとき・担当が替わったとき・定期的に）。1 本しか持てないと
# 入れ替えの日にサービスが止まるので、次の順で無停止に替える。
#   1. 新しい鍵をここへ足して再起動する（この時点で新旧どちらでも通る）
#   2. 呼ぶ側を落ち着いて新しい鍵へ書き換える
#   3. 古い鍵をここから消して再起動する
# 3 本以上は受けない（消し忘れた古い鍵がいつまでも生き続けるため）。
# 値は `openssl rand -base64 32`（44 文字）。32 文字未満は起動時に弾く。
keys = ["replace-me-with-openssl-rand-base64-32--"]

# このアプリが名乗れる環境名。ここに無い値で呼ばれたら弾く。
# 中身は使う側が決める。doorpost は空でないことだけを見る。
envs = ["production", "staging"]

# 呼び出し元として許す IP。単独の IP と CIDR のどちらも書ける。
# 前段に逆プロキシを置く構成では、サービスから見た呼び出し元はいつもその逆プロキシに
# なる。呼び出し元そのものの IP で絞るのは前段の仕事で、ここで見るのは
# 「逆プロキシ以外から直接叩かれていないこと」だけ。
# 空にすると起動しない。空を「全許可」と読ませないため。
allow_ips = ["127.0.0.1"]

[[apps]]
name = "bravo"

# 入れ替えの最中。新しいほうを足してから、呼ぶ側の書き換えが済んだら古いほうを消す。
keys = [
  "the-new-key-added-first-----------------",
  "the-old-key-removed-once-callers-moved--",
]

envs = ["production"]

# 別のホストから直接叩かれる構成にしたときだけ、その範囲をここへ書く。
allow_ips = ["203.0.113.0/24"]
